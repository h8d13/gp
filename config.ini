# sample config. install to $XDG_CONFIG_HOME/gp/config.ini
# precedence
# flags > ENV vars > .env > .ini
# or fallback to defaults
[user]
# user-agent = gp/1.0
# GP_USER_AGENT=gp/1.0

[pref]
allow-insecure = false
# GP_ALLOW_INSECURE=0
always-encrypt = true
# GP_ALWAYS_ENCRYPT=1
# parallel range-download connections; 1 disables (default). raise it
# some throttling CDNs, high-latency paths)
parallel = 1
# GP_PARALLEL=1
# min body size (bytes) before splitting; below this one stream wins.
parallel-min = 8388608
# GP_PARALLEL_MIN=8388608
# chunk size (bytes) for split downloads. also the resume granularity.
chunk-bytes = 4194304
# GP_CHUNK_BYTES=4194304
# speak HTTP/3 over QUIC instead of h1/h2. server must advertise h3.
quic = false
# GP_QUIC=0
# accept compressed transfer-encoding (gzip, zstd, br). off by default:
# identity bytes keep the Content-Length, byte ranges, and ETag intact (so
# split/resume/304 work). turn on only for large text/json fetches where wire
# compression pays. deflate is not supported (ambiguous coding).
compress = false
# GP_COMPRESS=0
# retries on 429/503: honors Retry-After, else exponential backoff. 0 off.
retries = 3
# GP_RETRIES=3
# backoff when the server sends no Retry-After: first step, then doubled
# per attempt with full jitter, capped at retry-cap-ms. both in ms.
retry-base-ms = 500
# GP_RETRY_BASE_MS=500
retry-cap-ms = 30000
# GP_RETRY_CAP_MS=30000
