# Sample sources for `gp up`. Install to ~/.config/gp/sources.ini (or
# $XDG_CONFIG_HOME/gp/). `gp up` installs/updates every [SECTION], `gp up check`
# resolves them without downloading, `gp rm NAME` forgets one. Tarballs extract
# into dest; other files are saved (an ELF/script is made executable). The
# examples below cover every form -- copy one and edit.

# keys -- a source is exactly one of: url | index | package | repo:
#   url      direct file link (version = ETag/Last-Modified)
#   index    directory-listing URL; pick one file by match/ext
#   package  owner/name of a Forgejo/Gitea generic package (needs host)
#   repo     owner/repo (GitLab: project path) for a forge release
#   tag      with repo: a git tag's source archive; <name> = literal tag (any
#            forge), true = newest tag (gitlab/gitea only)
#   forge    github (default) | gitea | gitlab
#   host     forge instance / API host (required for package; default per forge)
#   match    substrings the asset name must all contain
#   ext      extension the asset name must end with
#   as       rename a single-file install (archives ignore it)
#   extract  force tar extraction when the name lacks an archive extension
#   sha256 / sha256-url   verify the asset (GitHub releases verify automatically)
#   dest     install dir (~ expands); required
# auth (rate limits / private repos) via env: GITHUB_TOKEN / GITEA_TOKEN / GITLAB_TOKEN

# forge release (github is the default)
[CODIUM]
repo  = vscodium/vscodium
match = reh-linux-x64
ext   = tar.gz
dest  = ~/opt/codium

# gitea/forgejo release
[FORGEJO]
forge = gitea
host  = codeberg.org
repo  = forgejo/forgejo
match = linux-amd64
ext   = xz
dest  = ~/opt/forgejo

# gitlab release
[GLAB]
forge = gitlab
repo  = gitlab-org/cli
match = linux_amd64
ext   = tar.gz
dest  = ~/opt/glab

# bare url, single file (renamed, made executable)
[2048]
url  = https://raw.githubusercontent.com/h8d13/bash2048/master/bash2048.sh
as   = 2048
dest = ~/.local/bin

# directory index + checksum verify (match the stable name)
[ARCHBOOTSTRAP]
index = https://mirror.arizona.edu/archlinux/iso/latest/
match = bootstrap-x86_64
ext   = tar.zst
sha256-url = https://mirror.arizona.edu/archlinux/iso/latest/sha256sums.txt
dest  = ~/opt/arch-bootstrap

# Forgejo/Gitea generic package (Codeberg)
[LIBREWOLF]
package = librewolf/librewolf
host    = codeberg.org
match   = linux-x86_64-package
ext     = tar.xz
dest    = ~/opt/librewolf

# latest git tag's source archive (repo has no releases)
[GNUPG]
forge = gitlab
host  = gitlab.archlinux.org
repo  = archlinux/packaging/packages/gnupg
tag   = true
dest  = ~/opt/gnupg-pkg
