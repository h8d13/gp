# Sample sources for `gp up`. install to $XDG_CONFIG_HOME/gp/sources.ini
# (default ~/.config/gp/sources.ini), alongside config.ini.

# `gp up`   install/update every source below

# Each [SECTION] is one tool, in one of three forms:
#
#   forge release  gp asks the forge for the latest release and picks the one
#                  asset whose name contains every `match` token and ends with
#                  `ext`. Installs only when the release tag differs from the
#                  last install (tracked in sources.lock).
#   bare url       a direct file link via `url`. No forge, no release: the HTTP
#                  validator (ETag, else Last-Modified) is the version, so the
#                  file is refetched only when it changes on the server.
#   index          a directory-listing URL via `index` (Apache/nginx autoindex,
#                  distro mirrors). gp fetches the listing, picks the one file
#                  link matching `match`/`ext`, then versions it by the HTTP
#                  validator like a bare url. Point it at a "latest"-style dir;
#                  a listing with several matching files is an ambiguous error.
#
# Either way: tar/tar.gz/tgz are extracted into `dest`; anything else (AppImage,
# .deb, a bare binary, a script) is saved as a file, and a runnable file (ELF
# or "#!" script) is made executable.

# An ambiguous match (0 or >1 assets) is an error listing the
# candidates, so you can tighten `match`/`ext`.
#
# keys:
#   url     direct file link; when set this is a bare-url source and the forge
#           keys below are ignored (only `dest` is also required)
#   index   directory-listing URL; when set (and url unset) gp picks the file
#           link matching match/ext. Needs match or ext, plus dest
#   forge   github (default) | gitea | gitlab
#   host    API host; omit for the forge default (api.github.com, codeberg.org,
#           gitlab.com). Self-hosted: set the instance host; include a scheme
#           to override https, e.g. host = http://git.example.com:3000
#   repo    owner/repo (GitHub/Gitea) or the project path (GitLab)
#   match   space-separated substrings the asset name must all contain
#   ext     extension the asset name must end with
#   as      rename a single-file install to this bare filename (e.g. as = 2048);
#           ignored for archives, which extract many files
#   extract force tar extraction even when the name has no archive extension
#           (e.g. a /tarball API url); otherwise the extension decides
#   dest    where to install (~ expands to your home dir)
#   sha256  pinned sha256 (64 hex) the asset must hash to; install aborts on a
#           mismatch. Best for stable url/index sources (a release's assets
#           change each version, so a pinned digest there breaks auto-update)
#   sha256-url  URL of a checksums file (sha256sum listing or a bare per-asset
#           digest) to look the asset's sha256 up in; tracks across releases.
#           Mutually exclusive with sha256
#
# auth (optional, lifts rate limits / reaches private repos) is read from env:
#   GITHUB_TOKEN, GITEA_TOKEN, GITLAB_TOKEN

[CODIUM]
# forge = github
repo  = vscodium/vscodium
match = reh-linux-x64
ext   = tar.gz
dest  = ~/opt/codium

[FORGEJO]
forge = gitea
host  = codeberg.org
repo  = forgejo/forgejo
match = linux-amd64
ext   = xz
dest  = ~/opt/forgejo

[GLAB]
forge = gitlab
# host = gitlab.com
repo  = gitlab-org/cli
match = linux_amd64
ext   = tar.gz
dest  = ~/opt/glab

# Bare-url form: a direct file link, no forge. Refetched only when the file
# changes on the server (by ETag/Last-Modified)
[2048]
url  = https://raw.githubusercontent.com/h8d13/bash2048/master/bash2048.sh
as = 2048
dest = ~/.local/bin

# Index form: pick a file from a directory listing. Here the Arch bootstrap
# tarball from a mirror's latest/ dir; refetched when the server validator
# changes (the monthly rebuild). The dir holds both a dated build and a stable
# alias, so match the stable name precisely: "bootstrap-x86_64" (one token, the
# hyphen intact) hits archlinux-bootstrap-x86_64.tar.zst but NOT the dated
# archlinux-bootstrap-2026.06.01-x86_64.tar.zst, which would make the pick
# ambiguous. A loose "bootstrap x86_64" matches both and errors.
[ARCHBOOTSTRAP]
index = https://mirror.arizona.edu/archlinux/iso/latest/
match = bootstrap-x86_64
ext   = tar.zst
dest  = ~/opt/arch-bootstrap
