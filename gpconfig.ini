# sample config. install to $XDG_CONFIG_HOME/gp/gpconfig.ini
# (default ~/.config/gp/gpconfig.ini)
# precedence
# ENV vars > .env > .ini
# or fallback to default
[user]
# user-agent = gp/1.0
# USER_AGENT=gp/1.0

[pref]
allow-insecure = false
# ALLOW_INSECURE=0
always-encrypt = true
# ALWAYS_ENCRYPT=1
# parallel range-download connections; 1 disables (default). raise it
# only if your link's per-connection speed is below its capacity (some
# throttling CDNs, high-latency paths). on an already-saturated link it
# does nothing. needs -o, body >= parallel-min, Accept-Ranges: bytes.
parallel = 1
# PARALLEL=1
# min body size (bytes) before splitting; below this one stream wins.
parallel-min = 8388608
# PARALLEL_MIN=8388608
# speak HTTP/3 over QUIC instead of h1/h2. server must advertise h3.
quic = false
# QUIC=0
# retries on 429/503: honors Retry-After, else exponential backoff. 0 off.
retries = 3
# RETRIES=3
# backoff when the server sends no Retry-After: first step, then doubled
# per attempt with full jitter, capped at retry-cap-ms. both in ms.
retry-base-ms = 500
# RETRY_BASE_MS=500
retry-cap-ms = 30000
# RETRY_CAP_MS=30000
